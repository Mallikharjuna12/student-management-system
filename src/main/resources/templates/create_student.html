<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-primary text-white">
            <h3>Add Student</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/students}"
                  th:object="${student}"
                  method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        First Name
                    </label>

                    <input type="text"
                           th:field="*{firstName}"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Last Name
                    </label>

                    <input type="text"
                           th:field="*{lastName}"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control">

                </div>

                <button type="submit"
                        class="btn btn-success">

                    Save Student

                </button>

                <a th:href="@{/students}"
                   class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
